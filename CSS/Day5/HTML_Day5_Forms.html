<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Day 5: Variables & Layout Architecture</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="dashboard-container">
        <!-- Structural layout setup complete -->
                 <!-- Profile Card Component -->
        <article class="profile-card">
            <header class="card-header">
                <img class="avatar" src="https://twimg.com" alt="Khuman Dhakad Profile Picture">
                <h2 class="user-name">Khuman Dhakad</h2>
                <p class="user-title">Frontend Architecture Learner</p>
            </header>
            <section class="card-body">
                <ul class="stats-list">
                    <li><strong>30+</strong> Days Code</li>
                    <li><strong>6</strong> Commits/Day</li>
                </ul>
            </section>
            <footer class="card-actions">
                <button class="btn btn-primary" data-type="follow">Follow Progress</button>
                <button class="btn btn-secondary" data-type="message">Send Message</button>
            </footer>
        </article>

    </main>
</body>
</html>
