<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Day 3: Advanced UI Card</title>
    <link rel="stylesheet" href="style_day3.css">
</head>
<body>
    <article class="profile-card">
        <header class="card-header">
            <div class="avatar-placeholder"></div>
            <h2 class="user-name">Alex Dev</h2>
            <p class="user-title">Frontend Architecture Learner</p>
        </header>
        
        <section class="card-body">
            <ul class="stats-list">
                <li><strong>30+</strong> Days Code</li>
                <li><strong>3</strong> Commits/Day</li>
            </ul>
        </section>

        <footer class="card-actions">
            <button class="btn btn-primary" data-type="follow">Follow Progress</button>
            <button class="btn btn-secondary" data-type="message">Send Message</button>
        </footer>
    </article>
</body>
</html>
